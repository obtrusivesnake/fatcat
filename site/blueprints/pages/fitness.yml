title: Fitness Page

status: false

options:
  changeTemplate: false

tabs:
  content:
    label: Content
    icon: text
    fields:
      blocks:
        type: blocks
        label: Page Sections
        empty: Add a section to build this page.
        fieldsets:
          - page_header
          - header
          - fitness_list
          - left_image
          - right_image

  manage:
    label: Fitness Classes
    icon: heart
    sections:
      classes:
        type: pages
        label: Fitness Classes
        info: "{{ page.schedule }} · {{ page.class_time }}"
        template: fitness_class
        create: fitness_class
        empty: No fitness classes yet. Add one to get started.

  seo:
    label: SEO
    icon: search
    fields:
      meta_description:
        label: Meta Description
        type: textarea
        size: small
        maxlength: 160
        help: A short summary (up to 160 characters) shown in search engine results.
